openapi: 3.0.3
info:
  title: AgriLink Nigeria API
  version: 1.0.0
  description: AI-powered farm-to-market platform for Nigeria.
paths:
  /api/assistant/chat/:
    post:
      operationId: assistant_chat_create
      description: |-
        POST /api/assistant/chat/
        Send a text message to the AI assistant.
        Optionally pass conversation_id to continue a session;
        omit it to start a new conversation.

        Body:
            {
                "message": "I wan sell 50kg of tomato",
                "conversation_id": 3,   (optional)
                "language": "en"        (optional, default: "en")
            }
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/assistant/history/{conversation_id}/:
    get:
      operationId: assistant_history_retrieve
      description: |-
        GET /api/assistant/history/<conversation_id>/
        Returns all messages in a conversation (farmer must own it).
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/assistant/new/:
    post:
      operationId: assistant_new_create
      description: |-
        POST /api/assistant/new/
        Explicitly start a new conversation session and return its ID.
      tags:
      - assistant
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET  /api/auth/me/  — Return the authenticated user's profile.
        PUT  /api/auth/me/  — Update the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: auth_me_update
      description: |-
        GET  /api/auth/me/  — Return the authenticated user's profile.
        PUT  /api/auth/me/  — Update the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        POST /api/auth/register/
        Register a new user (farmer, buyer, or dispatcher).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/grading/assess/:
    post:
      operationId: grading_assess_create
      description: |-
        POST /api/grading/assess/
        Manually trigger AI grading for a listing that already has a photo.
        Body: { "listing_id": <int> }
      tags:
      - grading
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/grading/results/{listing_id}/:
    get:
      operationId: grading_results_retrieve
      description: |-
        GET /api/grading/results/<listing_id>/
        Retrieve the grading result for a specific produce listing.
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - grading
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/produce/collection-points/:
    get:
      operationId: produce_collection_points_list
      description: |-
        GET  /api/produce/collection-points/  — List collection points
        POST /api/produce/collection-points/  — Admin: add collection point
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionPointList'
          description: ''
    post:
      operationId: produce_collection_points_create
      description: |-
        GET  /api/produce/collection-points/  — List collection points
        POST /api/produce/collection-points/  — Admin: add collection point
      tags:
      - produce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPoint'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionPoint'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionPoint'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPoint'
          description: ''
  /api/produce/crops/:
    get:
      operationId: produce_crops_list
      description: |-
        GET  /api/produce/crops/         — List all crop types
        POST /api/produce/crops/         — Admin: add a new crop type
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCropTypeList'
          description: ''
    post:
      operationId: produce_crops_create
      description: |-
        GET  /api/produce/crops/         — List all crop types
        POST /api/produce/crops/         — Admin: add a new crop type
      tags:
      - produce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropType'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CropType'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CropType'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropType'
          description: ''
  /api/produce/listings/:
    get:
      operationId: produce_listings_list
      description: |-
        GET  /api/produce/listings/   — Browse all graded listings (buyers/dispatchers)
                                        OR the farmer's own listings if role==farmer
        POST /api/produce/listings/   — Farmer creates a new listing
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProduceListingList'
          description: ''
    post:
      operationId: produce_listings_create
      description: |-
        GET  /api/produce/listings/   — Browse all graded listings (buyers/dispatchers)
                                        OR the farmer's own listings if role==farmer
        POST /api/produce/listings/   — Farmer creates a new listing
      tags:
      - produce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceListing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProduceListing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProduceListing'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceListing'
          description: ''
  /api/produce/listings/{id}/:
    get:
      operationId: produce_listings_retrieve
      description: |-
        GET    /api/produce/listings/{id}/
        PUT    /api/produce/listings/{id}/  (farmer only, own listing)
        DELETE /api/produce/listings/{id}/  (farmer only, own listing)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceListing'
          description: ''
    put:
      operationId: produce_listings_update
      description: |-
        GET    /api/produce/listings/{id}/
        PUT    /api/produce/listings/{id}/  (farmer only, own listing)
        DELETE /api/produce/listings/{id}/  (farmer only, own listing)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - produce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduceListing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProduceListing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProduceListing'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceListing'
          description: ''
    patch:
      operationId: produce_listings_partial_update
      description: |-
        GET    /api/produce/listings/{id}/
        PUT    /api/produce/listings/{id}/  (farmer only, own listing)
        DELETE /api/produce/listings/{id}/  (farmer only, own listing)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - produce
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduceListing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduceListing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduceListing'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduceListing'
          description: ''
    delete:
      operationId: produce_listings_destroy
      description: |-
        GET    /api/produce/listings/{id}/
        PUT    /api/produce/listings/{id}/  (farmer only, own listing)
        DELETE /api/produce/listings/{id}/  (farmer only, own listing)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/produce/listings/{id}/upload-photo/:
    post:
      operationId: produce_listings_upload_photo_create
      description: |-
        POST /api/produce/listings/{id}/upload-photo/
        Upload a produce photo — triggers AI grading automatically.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - produce
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    CollectionPoint:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        state:
          type: string
          maxLength: 100
        lga:
          type: string
          maxLength: 100
        address:
          type: string
        has_cold_storage:
          type: boolean
        solar_powered:
          type: boolean
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
      required:
      - id
      - lga
      - name
      - state
    CropType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        typical_shelf_life_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        perishability_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: 1 (least) to 10 (most perishable)
      required:
      - id
      - name
    PaginatedCollectionPointList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CollectionPoint'
    PaginatedCropTypeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CropType'
    PaginatedProduceListingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProduceListing'
    PatchedProduceListing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer:
          type: integer
          readOnly: true
        farmer_name:
          type: string
          readOnly: true
        crop_type:
          type: integer
        crop_name:
          type: string
          readOnly: true
        collection_point:
          type: integer
          nullable: true
        collection_point_name:
          type: string
          readOnly: true
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        price_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        harvest_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        quality_grade:
          allOf:
          - $ref: '#/components/schemas/QualityGradeEnum'
          readOnly: true
        photo:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PreferredLanguageEnum:
      enum:
      - ha
      - yo
      - ig
      - pcm
      - en
      type: string
      description: |-
        * `ha` - Hausa
        * `yo` - Yoruba
        * `ig` - Igbo
        * `pcm` - Nigerian Pidgin
        * `en` - English
    ProduceListing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer:
          type: integer
          readOnly: true
        farmer_name:
          type: string
          readOnly: true
        crop_type:
          type: integer
        crop_name:
          type: string
          readOnly: true
        collection_point:
          type: integer
          nullable: true
        collection_point_name:
          type: string
          readOnly: true
        quantity_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        price_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        harvest_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        quality_grade:
          allOf:
          - $ref: '#/components/schemas/QualityGradeEnum'
          readOnly: true
        photo:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - collection_point_name
      - created_at
      - crop_name
      - crop_type
      - farmer
      - farmer_name
      - harvest_date
      - id
      - price_per_kg
      - quality_grade
      - quantity_kg
      - status
      - updated_at
    QualityGradeEnum:
      enum:
      - A
      - B
      - C
      - rejected
      - ungraded
      type: string
      description: |-
        * `A` - Grade A (Premium)
        * `B` - Grade B (Standard)
        * `C` - Grade C (Below Standard)
        * `rejected` - Rejected
        * `ungraded` - Not Yet Graded
    Register:
      type: object
      description: Handles registration for any role.
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          maxLength: 20
        state:
          type: string
        lga:
          type: string
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          default: en
      required:
      - password
      - password2
      - username
    RoleEnum:
      enum:
      - farmer
      - buyer
      - dispatcher
      - admin
      type: string
      description: |-
        * `farmer` - Farmer
        * `buyer` - Buyer
        * `dispatcher` - Dispatcher
        * `admin` - Admin
    StatusEnum:
      enum:
      - pending
      - graded
      - matched
      - sold
      - expired
      type: string
      description: |-
        * `pending` - Pending Grading
        * `graded` - Graded
        * `matched` - Matched to Buyer
        * `sold` - Sold
        * `expired` - Expired
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
