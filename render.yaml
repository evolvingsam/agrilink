services:
  - type: web
    name: agrilink-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn agrilink.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agrilink-db
          property: connectionString
